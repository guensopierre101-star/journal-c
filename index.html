<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE10th Journal</title>
<style>
:root{--bg:#f4f5f9;--sd:#fff;--card:#fff;--line:#e6e8f0;--tx:#1d1b4b;--mu:#6b7090;--ac:#6c4fe0;--g:#3dbb87;--r:#e5605c;--b:#6c63ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d1a;--sd:#080a15;--card:#0f1428;--line:#252d4a;--tx:#e8eaf6;--mu:#8b93b5;--ac:#7c6cf0;--g:#2ecc9a;--r:#ef5b5b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:flex;min-height:100vh}
aside{width:200px;flex:none;background:var(--sd);border-right:1px solid var(--line);padding:16px 10px}
.lg{font-weight:700;font-size:17px;margin:0 8px 16px;color:var(--ac)}
.lgo{display:inline-flex;border:2px solid #f2b705;background:#020b1f}.lgo b{color:#f2b705;font-size:15px;line-height:1;padding:7px 10px;letter-spacing:.3px}.lgo b+b{border-left:2px solid #f2b705}
nav button{display:block;width:100%;text-align:left;border:0;background:none;margin-bottom:4px}
nav button.on{background:var(--ac);color:#fff}
main{flex:1;min-width:0;padding:16px}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.c small,.mu{color:var(--mu)}.c b{display:block;font-size:20px;margin:2px 0}.c>b:first-child{font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.kr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.k5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:10px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.m{display:grid;grid-template-columns:1fr 240px;gap:12px;margin-bottom:12px}
.yg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}.ring i{width:32px;height:32px;border-radius:50%;background:var(--card)}
.hb{height:8px;border-radius:6px;background:var(--r);overflow:hidden;width:90px}.hb i{display:block;height:100%;background:var(--g)}
.g{color:var(--g)}.r{color:var(--r)}.p{border-color:var(--g)!important}.l{border-color:var(--r)!important}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.hd h2{margin:0;font-size:18px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dw{text-align:center;color:var(--mu);font-size:12px}
.d{min-height:62px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;text-align:right;font-size:11px;color:var(--mu);cursor:pointer}
.d.o{opacity:.35}.d b{display:block;text-align:center;font-size:13px;margin-top:4px}
.wk{margin-bottom:10px}.wk b{font-size:14px!important}
form,.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:8px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}
.it{padding:8px;border-bottom:1px solid var(--line);cursor:pointer}
.pb{height:10px;background:var(--line);border-radius:6px;margin:8px 0;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
h3{margin:14px 0 6px;font-size:15px}
.dg{display:grid;grid-template-columns:minmax(260px,1fr) 2.4fr;gap:12px;margin-bottom:12px}.col{display:grid;gap:12px;align-content:start}
.cg{display:grid;grid-template-columns:repeat(7,1fr) 100px;gap:6px}.cg .d{min-height:68px;background:var(--bg)}
.cg .d.p{background:color-mix(in srgb,var(--g) 20%,var(--card))}.cg .d.l{background:color-mix(in srgb,var(--r) 20%,var(--card))}.cg .d.z{background:color-mix(in srgb,var(--b) 18%,var(--card));border-color:var(--b)}
.cg .d b{font-size:14px;color:var(--tx)}.cg .d i{display:block;font-style:normal;color:var(--b)}
.wc{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:11px}.wc b{display:block;font-size:15px}
.pill{background:var(--bg);border-radius:10px;padding:1px 7px;font-size:11px;color:var(--mu);white-space:nowrap}.pill.g{color:var(--g)}.pill.r{color:var(--r)}
.sr{width:38px;height:38px;border:3px solid;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.sc{height:8px;border-radius:6px;background:linear-gradient(90deg,#ef6c5b,#f2c94c,#3dbb87);position:relative;margin:8px 0}.sc i{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--g);transform:translateX(-50%)}
.k4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.k7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:12px}.k7 .c{padding:8px 4px}
.k5 .c b,.k5 .c>.kr>div>small:first-child{white-space:nowrap}
.wcard{padding:20px}
.wd{padding:10px 14px}.wd>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}.wd>summary::-webkit-details-marker{display:none}.wd>summary::before{content:'\25B8';color:var(--mu);transition:transform .15s}.wd[open]>summary::before{transform:rotate(90deg)}.wcard .k4 .c b{font-size:24px}.tbc th{color:var(--mu);font-weight:500}.wcard a{color:var(--ac);cursor:pointer}
@media(max-width:860px){.k4{grid-template-columns:1fr 1fr}.k7{grid-template-columns:repeat(4,1fr)}}
.mw{flex:1;min-width:0}#tg{margin:10px 0 0 16px;background:none;border:0;padding:0;cursor:pointer}.app.cl aside{display:none}
.gal{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ph{position:relative}.ph img{height:120px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}.ph button{position:absolute;top:4px;right:4px;padding:0 6px}
.fb{border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;display:inline-block;background:var(--card);white-space:nowrap}
.zm{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;z-index:50;cursor:zoom-out}.zm img{max-width:95%;max-height:95%}
@media(max-width:860px){.dg{grid-template-columns:1fr}.cg{grid-template-columns:repeat(7,1fr) 62px;gap:3px}.cg .d{min-height:54px;padding:2px 3px;font-size:9px}.wc{padding:2px 4px}.wc .pill{display:none}}
@media(max-width:860px){.app{flex-direction:column}aside{width:auto;border:0}nav{display:flex;gap:6px;overflow-x:auto}nav button{width:auto;white-space:nowrap}.k5,.yg{grid-template-columns:1fr 1fr}.g3,.g2,.m{grid-template-columns:1fr}.d{min-height:50px}}
</style>
<style>
.tgpanel{background:#07090d;color:#f5e8bd;border:1px solid #d6a934;border-radius:12px;padding:22px;margin:12px 0;font-family:Arial,sans-serif}.tgpanel h2,.tgpanel h3{color:#e8bc53}.tgpanel small{color:#c4b68c}.tggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tgmetric{background:#12151a;border:1px solid #65532b;border-radius:9px;padding:15px}.tgmetric strong{display:block;font-size:25px;color:#f0c663}.tgcheck{display:flex;gap:10px;align-items:flex-start;padding:9px;border-bottom:1px solid #35302a}.tgcheck input{width:19px;flex:none;accent-color:#d6ad43}.tgcheck label{flex:1}.tgbadge{display:inline-block;border:1px solid #d7ad45;padding:5px 10px;border-radius:7px;color:#e8bc53}.tgpanel button{background:#1c1a15;color:#f2d68a;border:1px solid #a5802d}.tgphoto{width:100%;max-height:390px;object-fit:contain;background:#151515;border:1px solid #79632c;border-radius:8px;margin-top:12px}.tgresult{white-space:pre-wrap;background:#111820;border-left:3px solid #d6ad43;padding:15px;line-height:1.6}.tgform{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px;margin:12px 0}.tgform h3{margin-top:0}.tgform .tgcheck{color:var(--tx);border-color:var(--line)}
@media(min-width:850px){.tgpanel{max-width:1200px;margin:12px auto;padding:32px}}
</style>
<style>
.tgposter{background:#00131e;color:#f7f2e8;border:7px solid #e6d7b7;border-radius:5px;padding:18px;font-family:Arial,sans-serif;max-width:1540px;margin:12px auto}.tghead{display:grid;grid-template-columns:1fr 1.6fr .6fr;gap:12px;align-items:center;border-bottom:2px solid #c8a65d;padding:8px 12px 20px}.tghead h1{font-family:Georgia,serif;font-size:clamp(21px,3vw,43px);color:#f5d995;text-align:center;line-height:1.1;margin:0 0 12px}.tgsubtitle{text-align:center;letter-spacing:2px;font-size:12px}.tgbrand{display:flex;align-items:center;gap:10px;color:#f4d58a;font-family:Georgia,serif;font-size:clamp(17px,3vw,42px);font-weight:bold;white-space:nowrap}.tgbrand small{display:block;font:11px Arial;letter-spacing:3px}.tgseal{border:4px double #e9c678;border-radius:50%;padding:14px;font-size:26px}.tgquote{text-align:center;font:italic 18px Georgia;color:#ebd49d}.tgstats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:13px 0}.tgstats>div,.tgbox{background:#001e2c;border:1px solid #c6a363;border-radius:7px;padding:14px}.tgstats small{display:block;color:#d8cdb3;font-size:11px}.tgstats strong{display:block;color:#f1d185;font-size:clamp(15px,2vw,27px);margin-top:8px;overflow-wrap:anywhere}.tgcolumns{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}.tgbox h3{color:#f5d28b;border-bottom:1px solid #8d7851;font-size:17px;padding-bottom:8px;margin:0 0 12px}.tgbox p{line-height:1.5}.tgtrip{display:flex;justify-content:space-between;gap:5px;margin:20px 0}.tgpositive{color:#27d7a0}.tgnegative{color:#ff626a}.tggold{color:#ffcc59}.tgscore{font-size:52px;color:#2bdaa1;text-align:center;font-weight:bold;margin:20px}.tgtable{width:100%;border-collapse:collapse;font-size:13px;color:#eee}.tgtable th{background:#ebce91;color:#061420;padding:8px}.tgtable td{border-bottom:1px solid #254050;padding:7px;text-align:center}.tgfoot{border-top:2px solid #c7a461;color:#e9cc86;text-align:center;padding:18px;margin-top:14px;letter-spacing:2px;font-size:12px}.tgtradephoto{display:block;width:100%;height:auto;object-fit:contain;border:2px solid #c8aa6c}.tgplaceholder{padding:80px 20px;text-align:center;background:#1c2930}.tgcheckgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px}.tgcheckgrid>div{padding:5px;border-bottom:1px solid #23404c}@media(max-width:900px){.tgstats{grid-template-columns:repeat(3,1fr)}.tghead{grid-template-columns:1fr}.tgcolumns{grid-template-columns:1fr}.tgbrand{justify-content:center}.tgquote{display:none}.tgcheckgrid{grid-template-columns:1fr}}
</style></head><body>
<div class="app" id="app"><aside><nav id="nav"></nav><div class="lg" style="font-size:11px;margin:18px 8px 6px;color:var(--mu)">AFFICHAGE</div><div id="um" style="margin:0 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center"></div></aside><div class="mw"><button id="tg" data-a="tg" title="Ouvrir / fermer le menu"><span class="lgo"><b>TG</b><b>THE10th</b></span></button><main id="main"></main></div></div>
<script>
const K='journal_tz_v1',$=i=>document.getElementById(i);
let S={t:[],j:{},pb:{},b:10000,gm:0,gy:0,r:100,u:'usd'},pg='dash',sc='month',cur=new Date(),sel='',ed=null,q='',jd='';cur.setDate(1);
try{const x=JSON.parse(localStorage.getItem(K)||localStorage.getItem('journal_pro_v1'));if(x&&x.t)S={...S,...x};else S.t=JSON.parse(localStorage.getItem('journal_trades_v1')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const U=n=>{const a=Math.abs(n),u=S.u||'usd',R=S.r>0?(Math.round(a/S.r*100)/100).toLocaleString('fr-FR')+' R':'',D='$'+(Math.round(a*100)/100).toLocaleString('fr-FR');return u==='r'&&R?R:u==='both'&&R?D+' ('+R+')':D};
const f=n=>(n<0?'-':'+')+U(n);
const cl=n=>n>0?'g':n<0?'r':'',p2=n=>String(n).padStart(2,'0'),E={'+':'😀','0':'😐','-':'😟'};
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const sum=a=>a.reduce((s,t)=>s+t.v,0),Y=()=>String(cur.getFullYear()),YM=()=>Y()+'-'+p2(cur.getMonth()+1);
const srt=a=>[...a].sort((x,y)=>x.d<y.d?-1:1),pf=s=>s.pf===Infinity?'∞':s.pf.toFixed(2);
const dsum=a=>{const d={};a.forEach(t=>d[t.d]=(d[t.d]||0)+t.v);return Object.entries(d).sort((x,y)=>x[0]<y[0]?-1:1)};
function st(a){const n=a.length,w=a.filter(t=>t.v>0),l=a.filter(t=>t.v<0),gw=sum(w),gl=Math.abs(sum(l));let c=0,pk=0,dd=0;
srt(a).forEach(t=>{c+=t.v;pk=Math.max(pk,c);dd=Math.max(dd,pk-c)});
return{n,gw,gl,net:sum(a),wr:n?w.length/n*100:0,pf:gl?gw/gl:(gw?Infinity:0),aw:w.length?gw/w.length:0,al:l.length?gl/l.length:0,dd}}
const sco=()=>sc==='all'?S.t:S.t.filter(t=>t.d.startsWith(sc==='year'?Y():YM()));
const rg=p=>`<div class="ring" style="background:conic-gradient(var(--g) ${p*3.6}deg,var(--r) 0)"><i></i></div>`;
function cum(a){const d=dsum(a);if(d.length<2)return'<p class="mu">Pas assez de données.</p>';let c=0;const p=d.map(x=>c+=x[1]),mn=Math.min(0,...p),mx=Math.max(0,...p),r=mx-mn||1,W=600,H=150,y=z=>H-(z-mn)/r*(H-10)-5,pts=p.map((z,i)=>(i/(p.length-1)*W)+','+y(z)).join(' ');
return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:150px"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--line)" stroke-dasharray="4"/><polygon points="0,${y(0)} ${pts} ${W},${y(0)}" style="fill:var(--ac);opacity:.2"/><polyline fill="none" style="stroke:var(--ac)" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts}"/></svg>`}
function bars(d,lab){if(!d.length)return'<p class="mu">Aucun trade.</p>';const mx=Math.max(1,...d.map(x=>Math.abs(x[1]))),w=600/d.length;
return '<svg viewBox="0 0 600 150" preserveAspectRatio="none" style="width:100%;height:150px"><line x1="0" x2="600" y1="75" y2="75" style="stroke:var(--line)"/>'+d.map((x,i)=>{const h=Math.abs(x[1])/mx*68;return `<rect x="${i*w+w*.15}" width="${w*.7}" y="${x[1]>=0?75-h:75}" height="${h}" style="fill:var(--${x[1]>=0?'g':'r'})"/>`}).join('')+'</svg>'}
function radar(ax){const pt=(i,k)=>{const a=(-90+72*i)*Math.PI/180;return[(110+Math.cos(a)*70*k).toFixed(1),(100+Math.sin(a)*70*k).toFixed(1)]},g=k=>ax.map((_,i)=>pt(i,k).join(',')).join(' ');
return `<svg viewBox="0 0 220 200" style="width:100%;max-width:260px"><polygon points="${g(1)}" fill="none" style="stroke:var(--line)"/><polygon points="${g(.5)}" fill="none" style="stroke:var(--line)"/><polygon points="${ax.map((x,i)=>pt(i,x[1]/100).join(',')).join(' ')}" style="fill:var(--ac);fill-opacity:.35;stroke:var(--ac)"/>`+ax.map((x,i)=>{const p=pt(i,1.3);return `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" font-size="9" style="fill:var(--mu)">${x[0]}</text>`}).join('')+'</svg>'}
function cal(){const fi=new Date(cur),start=new Date(cur);start.setDate(1-fi.getDay());
const la=new Date(cur.getFullYear(),cur.getMonth()+1,0),rows=Math.ceil((fi.getDay()+la.getDate())/7),sh=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
let h=['D','L','M','M','J','V','S'].map(x=>`<div class="dw">${x}</div>`).join(''),wk=[];
for(let r=0;r<rows;r++){let ws=[],lab=[];
for(let c=0;c<7;c++){const d=new Date(start);d.setDate(start.getDate()+r*7+c);const k=iso(d),im=d.getMonth()===cur.getMonth(),ts=S.t.filter(t=>t.d===k),s=sum(ts);if(im){ws.push(...ts);lab.push(d)}
h+=`<div class="d${im?'':' o'}${ts.length?(s>=0?' p':' l'):''}" data-a="day" data-d="${k}">${d.getDate()}${ts.length?`<b class="${cl(s)}">${f(s)}</b>${ts.length} trade${ts.length>1?'s':''}`:''}</div>`}
if(lab.length)wk.push({n:r+1,ts:ws,a:lab[0],b:lab[lab.length-1]})}
return `<div class="m"><div class="c"><div class="hd"><button data-a="pm">‹</button><h2>${cur.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h2><button data-a="nm">›</button></div><div class="cal">${h}</div></div><div>`+
wk.map(x=>{const s=sum(x.ts);return `<div class="c wk ${x.ts.length?(s>=0?'p':'l'):''}"><div class="kr"><b>Semaine ${x.n}</b><small>${sh(x.a)} – ${sh(x.b)}</small></div><div class="kr"><b class="${cl(s)}">${x.ts.length?f(s):'$0'}</b><small>${x.ts.length} trades</small></div></div>`}).join('')+'</div></div>'}
function rows(a){const k=q.toLowerCase();return '<tr><th>Date</th><th>Paire</th><th>Sens</th><th>Setup</th><th>Émo</th><th>P&amp;L</th><th>Note</th><th></th></tr>'+
a.filter(x=>!k||[x.d,x.p,x.s,x.n].join(' ').toLowerCase().includes(k)).sort((x,y)=>x.d<y.d?1:-1).slice(0,300).map(x=>`<tr><td>${x.d}</td><td>${esc(x.p)}</td><td>${x.x==='S'?'Short':x.x==='L'?'Long':''}</td><td>${esc(x.s)}</td><td>${E[x.e]||''}</td><td class="${cl(x.v)}">${f(x.v)}</td><td>${esc(x.n)}</td><td><button data-a="edit" data-i="${esc(x.id)}">✎</button> <button data-a="del" data-i="${esc(x.id)}">✕</button></td></tr>`).join('')}
function dash(){const a=sco(),s=st(a),d=dsum(a),dp=d.length?d.filter(x=>x[1]>0).length/d.length*100:0,
ax=[['Win %',s.wr],['Profit factor',Math.min(s.pf/3,1)*100],['Gain/Perte',s.al?Math.min(s.aw/s.al/2,1)*100:0],['Drawdown',S.b?Math.max(0,100-s.dd/S.b*1000):50],['Jours gagnants',dp]],
kc=(l,v,sub,x)=>`<div class="c"><div class="kr"><div><small>${l}</small><b>${v}</b><small>${sub}</small></div>${x||''}</div></div>`,
bt=[['month','Mois affiché'],['year','Année'],['all','Tout']].map(([k,l])=>`<button data-a="sc" data-v="${k}" class="${sc===k?'on':''}">${l}</button>`).join('');
return `<div class="bar">${bt}</div><div class="k5">`+
kc('P&amp;L net',`<span class="${cl(s.net)}">${a.length?f(s.net):'$0'}</span>`,s.n+' trades')+
kc('Trade win %',s.wr.toFixed(1)+' %',s.n?'':'–',rg(s.wr))+
kc('Profit factor',pf(s),'gains ÷ pertes',rg(s.gw+s.gl?s.gw/(s.gw+s.gl)*100:0))+
kc('Day win %',dp.toFixed(1)+' %',d.length+' jours',rg(dp))+
kc('Gain moy. / perte moy.',s.al?(s.aw/s.al).toFixed(2):'–',`<span class="g">$${Math.round(s.aw)}</span> / <span class="r">$${Math.round(s.al)}</span>`,`<div class="hb"><i style="width:${s.aw+s.al?s.aw/(s.aw+s.al)*100:50}%"></i></div>`)+
`</div><div class="g3"><div class="c"><b>Score du journal : ${Math.round(ax.reduce((z,x)=>z+x[1],0)/5)}</b>${radar(ax)}</div><div class="c"><b>P&amp;L net cumulé</b>${cum(a)}</div><div class="c"><b>P&amp;L net par jour</b>${bars(d)}</div></div>`+

function tgPeriod(kind){let start,end,title;if(kind==='week'){const k=wk?wk.s:monOf(iso(new Date()));start=k;end=addD(k,6);title='SEMAINE '+isoW(k)+' · '+start+' au '+end}else{start=YM()+'-01';end=iso(new Date(cur.getFullYear(),cur.getMonth()+1,0));title=cur.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}).toUpperCase()}return{a:S.t.filter(t=>t.d>=start&&t.d<=end),title,start,end}}
function tgMoneyR(t){return S.r>0?Number(t.v||0)/S.r:null}
function tgR(t){const r=tgMoneyR(t);return r===null?'—':(r>0?'+':'')+r.toFixed(2)+'R'}
function tgAudit(a){let y=0,n=0,na=0;const fails={};a.forEach(t=>TGCORE.forEach(i=>{const v=t.tgc?.[i];if(v==='yes')y++;else if(v==='no'){n++;fails[TGRULES[i]]=(fails[TGRULES[i]]||0)+1}else na++}));return{y,n,na,p:y+n?Math.round(100*y/(y+n)):null,fails:Object.entries(fails).sort((a,b)=>b[1]-a[1])}}
function tgGraphic(a){let running=0;const points=[0,...a.slice().sort((x,y)=>(x.d||'').localeCompare(y.d||'')).map(t=>running+=Number(t.v||0)/(S.r||1))];const low=Math.min(0,...points),high=Math.max(1,...points),coords=points.map((v,i)=>`${32+i*(680/Math.max(1,points.length-1))},${210-(v-low)/(high-low)*165}`).join(' ');return `<svg viewBox="0 0 750 235" style="width:100%;height:220px"><g stroke="#26414b" stroke-width="1">${[0,1,2,3,4].map(i=>`<line x1="30" y1="${25+i*46}" x2="728" y2="${25+i*46}"/>`).join('')}</g><polyline points="${coords}" fill="none" stroke="#21d79c" stroke-width="4" stroke-linejoin="round"/><text x="34" y="18" fill="#dfbd72" font-size="15">ÉVOLUTION DU P&L EN R</text><text x="670" y="227" fill="#f4d58d" font-size="15">${(running>=0?'+':'')+running.toFixed(2)}R</text></svg>`}
function tgTable(a){return `<table class="tgtable"><thead><tr><th>#</th><th>Date</th><th>Direction</th><th>Résultat</th><th>R</th><th>Discipline</th></tr></thead><tbody>${a.map((t,i)=>{const vals=TGCORE.map(j=>t.tgc?.[j]).filter(x=>x==='yes'||x==='no');const score=vals.length?Math.round(vals.filter(x=>x==='yes').length/vals.length*100)+'%':'—';return `<tr><td>${i+1}</td><td>${esc(t.d||'')}</td><td>${t.x==='L'?'BUY':'SELL'}</td><td>${esc(t.rs||'—')}</td><td style="color:${t.v>=0?'#29d69b':'#ff666b'}">${tgR(t)}</td><td>${score}</td></tr>`}).join('')||'<tr><td colspan="6">Aucun trade enregistré</td></tr>'}</tbody></table>`}
function tgFlyer(kind){const {a,title}=tgPeriod(kind),{s,w,loss,be}=tgStats(a),au=tgAudit(a),rnet=a.reduce((z,t)=>z+(tgMoneyR(t)||0),0),wins=a.length?(100*w/a.length).toFixed(1):'0',n=a.length;const best=a.slice().sort((x,y)=>y.v-x.v)[0],worst=a.slice().sort((x,y)=>x.v-y.v)[0];return `<div class="tgposter" id="tgflyer"><header class="tghead"><div class="tgbrand"><span class="tgseal">TG</span><span>THE10<sup>th</sup><small>TRADING GROUP</small></span></div><div><h1>RAPPORT ${kind==='week'?'HEBDOMADAIRE':'MENSUEL'}<br>DE TRADING</h1><div class="tgsubtitle">DISCIPLINE　•　STRATÉGIE　•　RÉSULTATS</div></div><div class="tgquote">EUR/USD<br>M1　|　R:R 1:3</div></header><div class="tgstats">${[['PÉRIODE',title],['TOTAL DES TRADES',n],['GAGNANTS (TP)',w+' · '+wins+'%'],['PERDANTS (SL)',loss],['BREAK EVEN',be],['P&L TOTAL',(rnet>=0?'+':'')+rnet.toFixed(2)+'R']].map(([k,v])=>`<div><small>${k}</small><strong>${esc(String(v))}</strong></div>`).join('')}</div><div class="tgcolumns"><section class="tgbox tgwide"><h3>ÉVOLUTION DU SOLDE EN R</h3>${tgGraphic(a)}</section><section class="tgbox"><h3>RÉPARTITION DES RÉSULTATS</h3><div class="tgtrip"><span class="tgpositive">● TP : ${w}</span><span class="tgnegative">● SL : ${loss}</span><span class="tggold">● BE : ${be}</span></div><h3>SCORE DE DISCIPLINE</h3><div class="tgscore">${au.p===null?'Non évalué':au.p+'%'}</div><small>${au.y} règles respectées · ${au.n} non respectées · ${au.na} non évaluées / N/A</small></section><section class="tgbox tgwide"><h3>LISTE DES TRADES ${kind==='week'?'DE LA SEMAINE':'DU MOIS'}</h3><div style="overflow:auto">${tgTable(a)}</div></section><section class="tgbox"><h3>ANALYSE DES DONNÉES DU JOURNAL</h3><p>${n} trades enregistrés. ${w} gagnants, ${loss} perdants et ${be} break even. Win rate : ${wins}%. Résultat total : ${(rnet>=0?'+':'')+rnet.toFixed(2)}R.</p><h3>RÈGLES LES PLUS VIOLÉES</h3>${au.fails.length?au.fails.slice(0,4).map(([k,v])=>`<p>⚠ ${esc(k)} (${v})</p>`).join(''):'<p>Aucune violation déclarée dans les checklists.</p>'}<h3>MEILLEUR / MOINS BON TRADE</h3><p>Meilleur : ${best?tgR(best):'—'} · Moins bon : ${worst?tgR(worst):'—'}</p><small>Analyse descriptive automatique. Les constats dépendent des données saisies.</small></section></div><footer class="tgfoot">THE10th TRADING GROUP　　•　　TRADER AVEC MÉTHODE　　•　　PROGRESSER CHAQUE JOUR</footer></div><div class="bar"><button data-a="tgsnap">📷 Télécharger ce flyer PNG</button><button data-a="tgai" data-kind="${kind}">🤖 Demander une analyse IA</button></div>`}
function tgTradeFlyer(){const t=S.t.find(x=>String(x.id)===String(tgSelectedTrade))||S.t[0];if(!t)return '<div class="tgpanel">Ajoutez un trade pour générer son rapport.</div>';const photos=IM[t.id]||[],au=tgAudit([t]),res=t.rs||((t.v||0)>0?'TP':(t.v||0)<0?'SL':'BE');return `<div class="tgposter" id="tgflyer"><header class="tghead"><div class="tgbrand"><span class="tgseal">TG</span><span>THE10<sup>th</sup><small>TRADING GROUP</small></span></div><div><h1>RAPPORT<br>D’ANALYSE DE TRADE</h1><div class="tgsubtitle">DISCIPLINE　•　STRATÉGIE　•　RÉSULTATS</div></div><div class="tgquote">EUR/USD<br>M1</div></header><div class="tgstats">${[['INSTRUMENT',t.p||'EUR/USD'],['DIRECTION',t.x==='L'?'BUY':'SELL'],['DATE',t.d||'—'],['HEURE',t.h||'—'],['RÉSULTAT',res],['P&L',tgR(t)]].map(([k,v])=>`<div><small>${k}</small><strong>${esc(String(v))}</strong></div>`).join('')}</div><div class="tgcolumns"><section class="tgbox tgwide"><h3>SCREENSHOT ORIGINAL DU TRADE</h3>${photos.length?`<img class="tgtradephoto" src="${photos[0].d}" alt="Screenshot enregistré pour ce trade">`:'<div class="tgplaceholder">Aucune photo enregistrée pour ce trade. Ajoutez-la depuis le formulaire Trades.</div>'}</section><section class="tgbox"><h3>RÉCAPITULATIF</h3><p>Entry : ${esc(t.en??'—')}</p><p>SL : ${esc(t.sl??'—')}</p><p>TP : ${esc(t.tp??'—')}</p><p>Résultat : ${esc(res)}</p><h3>SCORE DE DISCIPLINE</h3><div class="tgscore">${au.p===null?'Non évalué':au.p+'%'}</div><small>${au.y} oui · ${au.n} non</small></section><section class="tgbox tgwide"><h3>CHECKLIST · RESPECT DU PLAYBOOK</h3><div class="tgcheckgrid">${TGCORE.map(i=>`<div><span style="color:${t.tgc?.[i]==='yes'?'#29d69b':t.tgc?.[i]==='no'?'#ff626a':'#d4b76b'}">${t.tgc?.[i]==='yes'?'✓':t.tgc?.[i]==='no'?'✕':'–'}</span> ${esc(TGRULES[i])}</div>`).join('')}</div></section><section class="tgbox"><h3>ANALYSE DU TRADE</h3><p>${esc(t.n||'Aucune note enregistrée.')}</p><h3>POINTS À AMÉLIORER</h3>${au.fails.length?au.fails.map(([k])=>`<p>⚠ ${esc(k)}</p>`).join(''):'<p>Aucune violation déclarée.</p>'}<small>Le screenshot est repris tel quel. Aucune validation visuelle automatique n’est garantie.</small></section></div><footer class="tgfoot">THE10th TRADING GROUP　•　RAPPORT INDIVIDUEL</footer></div><div class="bar"><button data-a="tgsnap">📷 Télécharger ce flyer PNG</button><button data-a="tgai" data-kind="trade">🤖 Demander une analyse IA</button></div>`}
let tgSelectedTrade=null;
function tgPage(){return `<div class="hd"><h2>THE10th · Playbook et flyers</h2></div><div class="bar"><button data-a="tgview" data-v="playbook" class="${tgView==='playbook'?'on':''}">📘 Playbook officiel</button><button data-a="tgview" data-v="report" class="${tgView==='report'?'on':''}">📊 Flyers des résultats</button></div>${tgView==='playbook'?`<div class="tgpanel" style="padding:14px"><h2 style="color:#f2c760">PLAYBOOK OFFICIEL THE10th</h2><p>Voici votre flyer original, avec toutes les règles.</p><img src="${TG_PLAYBOOK_IMAGE}" alt="Playbook THE10th original" style="width:100%;max-width:1024px;height:auto;display:block;margin:12px auto;border:1px solid #bd8c2e"><div class="bar"><button data-a="tgoriginal">📥 Télécharger le flyer original</button><button data-a="tgview" data-v="rules">📋 Voir les 20 règles en texte</button></div></div>`:tgView==='rules'?`<div class="tgpanel"><h2>LES 20 RÈGLES THE10th</h2>${TGRULES.map((r,i)=>`<p style="font-size:16px;line-height:1.6;border-bottom:1px solid #53421e;padding:8px"><b style="color:#f2c760">${String(i+1).padStart(2,'0')}</b> ${esc(r)} ${i>=16?'<small style="color:#d6ac55">(à tester)</small>':''}</p>`).join('')}<button data-a="tgview" data-v="playbook">← Retour au flyer</button></div>`:`<div class="bar"><button data-a="tgkind" data-kind="trade" class="${tgKind==='trade'?'on':''}">Flyer trade</button><button data-a="tgkind" data-kind="week" class="${tgKind==='week'?'on':''}">Flyer semaine</button><button data-a="tgkind" data-kind="month" class="${tgKind==='month'?'on':''}">Flyer mois</button><button data-a="pm">‹ Mois</button><button data-a="nm">Mois ›</button></div>${tgKind==='trade'?`<div class="bar"><label>Choisir le trade <select id="tgselect" onchange="tgSelectedTrade=this.value;render()">${S.t.map(t=>`<option value="${esc(String(t.id))}" ${String(t.id)===String(tgSelectedTrade||S.t[0]?.id)?'selected':''}>${esc(t.d||'')} · ${t.x==='L'?'BUY':'SELL'} · ${esc(t.rs||'—')}</option>`).join('')}</select></label></div>${tgTradeFlyer()}`:tgFlyer(tgKind)}`}`}
let tgKind='month',tgView='playbook';

const P=[['dash','📊 Tableau de bord'],['journal','📓 Journal quotidien'],['trades','🧾 Trades'],['reports','📈 Rapports'],['pb','📘 Playbook'],['the10','🏆 THE10th'],['ai','🤖 Assistant IA']];
function render(){$('nav').innerHTML=P.map(([k,l])=>`<button data-a="nav" data-p="${k}" class="${k===(pg==='week'?'dash':pg)?'on':''}">${l}</button>`).join('');
$('um').innerHTML=[['usd','$'],['r','R'],['both','$ + R']].map(([k,l])=>`<button data-a="um" data-m="${k}" class="${(S.u||'usd')===k?'on':''}">${l}</button>`).join('')+`<label class="mu" style="font-size:12px;display:flex;align-items:center;gap:4px">1R = $<input type="number" data-k="r" value="${S.r}" style="width:80px;padding:4px"></label>`;
$('main').innerHTML={dash:dash2,journal:jr2,trades:tp,reports:rp,pb:pbk,week:wkp3,ai:aip,the10:tgPage}[pg]()}
document.onclick=e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,d=t.dataset;
if(a==='tgselect'){return}else if(a==='tgview'){tgView=d.v;pg='the10'}else if(a==='tgoriginal'){const x=document.createElement('a');x.href=TG_PLAYBOOK_IMAGE;x.download='THE10th_Playbook_Officiel.png';document.body.appendChild(x);x.click();x.remove();return}else if(a==='tgkind'){tgKind=d.kind;tgView='report';pg='the10'}else if(a==='tgsnap'){snap('#tgflyer','THE10th-rapport-'+tgKind+'-'+YM()+'.png');return}else if(a==='tgai'){const z=d.kind==='trade'?{title:'TRADE',a:[S.t.find(t=>String(t.id)===String(tgSelectedTrade))||S.t[0]].filter(Boolean)}:tgPeriod(d.kind),a=z.a,ts=tgStats(a);pg='ai';render();aiAsk('Analyse le rapport THE10th '+z.title+'. Vérifie la discipline, les règles cochées, les erreurs et les résultats. Donne des constats fondés sur les données, sans inventer. Trades: '+JSON.stringify(a.map(t=>({date:t.d,sens:t.x,pnl:t.v,entry:t.en,sl:t.sl,tp:t.tp,resultat:t.rs,checklist:t.tgc,statut:t.tgstate,motif:t.tgreason,note:t.n}))).slice(0,18000));return}else if(a==='nav')pg=d.p;else if(a==='sc')sc=d.v;else if(a==='today'){cur=new Date();cur.setDate(1)}
else if(a==='wk'){wk={n:+d.n,s:d.s,e:d.e};pg='week'}
else if(a==='back')pg='dash';
else if(a==='aicfg'){const c={p:$('ai_p').value,gm:$('ai_gm').value.trim(),xm:$('ai_xm').value.trim()};try{localStorage.setItem('journal_ai_cfg',JSON.stringify(c));const g=$('ai_kg').value.trim(),x=$('ai_kx').value.trim();if(g)localStorage.setItem('jk_gemini',g);if(x)localStorage.setItem('jk_grok',x)}catch(e){}}
else if(a==='aiclr'){try{localStorage.removeItem('jk_gemini');localStorage.removeItem('jk_grok')}catch(e){}}
else if(a==='snap'){const T={dash:['#main','tableau-de-bord-'+(sc==='month'?YM():sc==='year'?Y():'tout')],week:['#main','semaine-'+(wk?wk.s:'')],month:['#capcal','mois-'+YM()]}[d.t];snap(T[0],T[1]+'.png');return}
else if(a==='see'){const z=document.createElement('div');z.className='zm';z.style.overflow='auto';z.style.placeItems='start center';z.innerHTML='<div style="display:grid;gap:10px;padding:16px;max-width:900px">'+(IM[d.i]||[]).map(x=>'<img src="'+x.d+'" style="max-width:100%;max-height:none">').join('')+'</div>';z.onclick=()=>z.remove();document.body.appendChild(z);return}
else if(a==='aiq'){aiAsk(d.q);return}
else if(a==='aisend'){const i=$('aii'),q0=i.value;i.value='';aiAsk(q0);return}
else if(a==='um'){S.u=d.m;save()}
else if(a==='wp'){wk={s:addD(wk.s,-7),e:addD(wk.s,-1)}}
else if(a==='wn'){wk={s:addD(wk.s,7),e:addD(wk.s,13)}}
else if(a==='wt'){const m=monOf(iso(new Date()));wk={s:m,e:addD(m,6)}}
else if(a==='tg'){const ap=$('app');ap.classList.toggle('cl');try{localStorage.setItem('journal_sb',ap.classList.contains('cl')?'1':'0')}catch(x){}return}
else if(a==='zoom'){const z=document.createElement('div');z.className='zm';z.innerHTML='<img src="'+t.src+'">';z.onclick=()=>z.remove();document.body.appendChild(z);return}
else if(a==='rmimg'){delImg(d.k)}
else if(a==='pm')cur.setMonth(cur.getMonth()-1);else if(a==='nm')cur.setMonth(cur.getMonth()+1);
else if(a==='py')cur.setFullYear(cur.getFullYear()-1);else if(a==='ny')cur.setFullYear(cur.getFullYear()+1);
else if(a==='day'||a==='jopen'){jd=d.d;pg='journal'}
else if(a==='addday'){sel=d.d;ed=null;pg='trades'}

else if(a==='edit'){ed=d.i;pg='trades'}
else if(a==='del'){if(d.c!=='1'){t.dataset.c='1';t.textContent='Sûr ?';return}(IM[d.i]||[]).slice().forEach(x=>delImg(x.k));S.t=S.t.filter(z=>String(z.id)!==d.i);save()}
else if(a==='jsave'){const k=$('jdt').value;S.j[k]={m:$('jm').value,n:$('jn').value};jd=k;save()}
else if(a==='pbadd'){const n=$('pbn').value.trim();if(!n)return;S.pb[n]=$('pbr').value;save()}
else if(a==='pbdel'){delete S.pb[d.n];save()}
else if(a==='xj'){$('io').value=JSON.stringify(S);$('msg').textContent='Copie ce texte pour sauvegarder.';return}
else if(a==='xc'){$('io').value='date,paire,sens,setup,emotion,pnl,note\n'+srt(S.t).map(t=>[t.d,t.p,t.x||'',t.s||'',t.e||'',t.v,'"'+(t.n||'').replace(/"/g,'""')+'"'].join(',')).join('\n');$('msg').textContent='Copie ce CSV.';return}
else if(a==='im'){try{const o=JSON.parse($('io').value);if(Array.isArray(o))S.t=o;else if(o&&o.t)S={...S,...o};else throw 0;save()}catch(x){$('msg').textContent='JSON invalide.';return}}
render()};
document.onchange=e=>{const t=e.target;if(t.id==='ff'){PF=[...t.files];$('ffn').textContent=PF.length+' photo(s) prête(s)'}else if(t.dataset.t){addImgs(t.dataset.t,[...t.files])}else if(t.id==='jdt'){jd=t.value;render()}else if(t.dataset.k){S[t.dataset.k]=+t.value||0;save();render()}else if(t.dataset.pb!==undefined){S.pb[t.dataset.pb]=t.value;save()}};
document.oninput=e=>{if(e.target.id==='sq'){q=e.target.value;$('tb').innerHTML=rows(S.t)}};
document.onsubmit=e=>{e.preventDefault();const o={id:ed||Date.now()+'-'+Math.random().toString(36).slice(2,5),d:$('fd').value,p:$('fp').value||'EUR/USD',x:$('fx').value,v:$('fv').value!==''?parseFloat($('fv').value):parseFloat($('fr').value)*(S.r||0),s:$('fs').value.trim(),e:$('fe').value,n:$('fn').value,h:$('fh').value,en:$('fen').value,sl:$('fsl').value,tp:$('ftp').value,rs:$('frs').value,tgc:Object.fromEntries([...document.querySelectorAll('[data-tgr]')].filter(x=>x.value).map(x=>[x.dataset.tgr,x.value])),tgstate:$('tgstate')?.value||'execute',tgreason:$('tgreason')?.value||''};
if(isNaN(o.v)||($('fv').value===''&&!(S.r>0)))return;if(ed)S.t=S.t.map(z=>String(z.id)===ed?o:z);else S.t.push(o);ed=null;sel=o.d;if(PF.length){addImgs(o.id,PF);PF=[]}cur=new Date(+o.d.slice(0,4),+o.d.slice(5,7)-1,1);save();render()};
